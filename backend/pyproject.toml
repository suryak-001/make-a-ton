[project]
name = "brightloop-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.2",
    "python-multipart>=0.0.32",
    "reportlab>=5.1.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 110
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI's Depends() in argument defaults is the idiom
    "E501",  # the formatter owns line length; long comments/strings are fine
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
